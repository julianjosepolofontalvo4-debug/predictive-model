[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-quant-engine"
version = "0.4.0"
description = "Probabilistic football analytics engine: goals, corners, cards, Monte Carlo, bootstrap and stress testing."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13", "requests>=2.32"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]